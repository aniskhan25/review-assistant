[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-review-assistant"
version = "0.1.0"
description = "Offline evidence-assisted technical reviews with mandatory human confirmation"
requires-python = ">=3.11"
dependencies = ["pdfplumber==0.11.9"]

[project.optional-dependencies]
test = ["pytest==9.1.0"]
masked = ["torch>=2.6", "transformers>=4.51,<6"]

[project.scripts]
review-assistant = "app.server:main"
review-benchmark = "app.evaluation:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
